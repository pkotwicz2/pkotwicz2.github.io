<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minimal ARIA Live Demo</title>
    <style>div { margin: 10px 0; padding: 10px; border: 1px solid #666; font-family: sans-serif; }</style>
</head>
<body>
    <button onclick="document.getElementById('BarPoliteBox').innerText = 'CRITICAL ALERT @ ' + new Date().toLocaleTimeString()">
        Trigger Polite
    </button>
    <button onclick="document.getElementById('BazAssertiveBox').innerText = 'CRITICAL ALERT @ ' + new Date().toLocaleTimeString()">
        Trigger Assertive
    </button>

    <h3 id="BarPoliteBox" aria-live="assertive" aria-atomic="true"><strong>Polite</strong> region ready</h3>
    <div id="BazAssertiveBox" aria-live="assertive" aria-atomic="true">Assertive region ready</div>
</body>
</html>
