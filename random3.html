<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minimal ARIA Live Demo</title>
    <style>
        h3.a {margin: 10px 0; padding: 10px; border: 1px solid #666; font-family: sans-serif;
            content: url('https://dummyimage.com/16x16/000/fff') / "Denotes completed task";
        }
    </style>
</head>
<body>
    <h2>Tasks</h2>
    <h3 id="BarPoliteBox" aria-live="assertive" aria-atomic="true" class="a">Task1</h3>
</body>
</html>
