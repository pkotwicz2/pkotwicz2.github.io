<h2>De Moivre's Theorem</h2>
<p>
<math xmlns="http://www.w3.org/1998/Math/MathML">
<mrow>
      <mi>x</mi>
      <mo>=</mo>
      <mi>i</mi>
      <mi>sin</mi>
      <mi>θ</mi>
    </mrow>
</math><br/>
<math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
  <mrow>
    <mi>x</mi>
    <mo>=</mo>
    <mrow>
      <mi>i</mi>
      <mo>&#x2062;</mo> <!-- invisible times -->
      <mrow>
        <mi>sin</mi>
        <mo>&#x2061;</mo> <!-- function application -->
        <mrow>
          <mo>(</mo>
          <mi>z</mi>
          <mo>)</mo>
        </mrow>
      </mrow>
    </mrow>
  </mrow>
</math>
<br /><br />
<a href="http://en.wikipedia.org/wiki/De_Moivre's_formula">source</a>
</p>
