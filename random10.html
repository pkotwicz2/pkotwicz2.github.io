<html>
<body>
<button id="test" onclick="ABCD()">Test</button>
<div id="done"></div>
<script>
function ABCD() {
    var el = document.getElementById("test");
    if (el.hasAttribute("aria-pressed")) {
        el.removeAttribute("aria-pressed");
    } else {
        el.setAttribute("aria-pressed", "true");
    }
}
</script>
</body>
</html>
