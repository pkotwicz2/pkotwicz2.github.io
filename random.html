<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Accessible Treegrid</title>
  <style>
    .tg-container {
      border: 1px solid #dadce0;
      border-radius: 8px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 600px;
    }
    .tg-row {
      display: flex;
      border-bottom: 1px solid #e8eaed;
    }
    .tg-row:last-child { border-bottom: none; }
    .tg-header {
      background-color: #f8f9fa;
      font-weight: 600;
      color: #3c4043;
    }
    .tg-cell {
      flex: 1;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      min-width: 0;
    }
    /* Visual indicator when navigating hierarchy */
    .tg-cell:first-child::before {
      content: ' ';
      display: inline-block;
      width: 16px;
    }
    .tg-row[aria-level="2"] .tg-cell:first-child { padding-left: 40px; }
    .tg-row[aria-level="3"] .tg-cell:first-child { padding-left: 64px; }

    /* Roving Focus Indicator */
    .tg-cell:focus {
      outline: 2px solid #1a73e8;
      outline-offset: -2px;
      background-color: #e8f0fe;
    }
    .tg-expander {
      cursor: pointer;
      margin-right: 8px;
      user-select: none;
      font-size: 10px;
      width: 12px;
    }
    .tg-row.collapsed + .tg-children { display: none; }
  </style>
</head>
<body>

<div role="treegrid" aria-label="Project Repository" id="my-treegrid" class="tg-container">
  <!-- Column Headers -->
  <div role="rowgroup" class="tg-header">
    <div role="row" class="tg-row">
      <div role="columnheader" class="tg-cell" id="col-name">Name</div>
      <div role="columnheader" class="tg-cell" id="col-type">Type</div>
      <div role="columnheader" class="tg-cell" id="col-size">Size</div>
    </div>
  </div>

  <!-- Body -->
  <div role="rowgroup" id="tg-body">
    
    <!-- Level 1: Item 1 -->
    <div 
      role="row" 
      class="tg-row" 
      aria-level="1" 
      aria-posinset="1" 
      aria-setsize="2" 
      aria-expanded="true" 
      id="row-src">
      <!-- First cell serves as the tree node controller -->
      <div role="gridcell" class="tg-cell" tabindex="0">
        <span class="tg-expander" aria-hidden="true">▼</span>
        <span>src</span>
      </div>
      <div role="gridcell" class="tg-cell" tabindex="-1">Folder</div>
      <div role="gridcell" class="tg-cell" tabindex="-1">—</div>
    </div>

    <!-- Nested Level 2 Children -->
    <div class="tg-children" id="children-src">
      <div 
        role="row" 
        class="tg-row" 
        aria-level="2" 
        aria-posinset="1" 
        aria-setsize="2" 
        id="row-index">
        <div role="gridcell" class="tg-cell" tabindex="-1">index.js</div>
        <div role="gridcell" class="tg-cell" tabindex="-1">JS File</div>
        <div role="gridcell" class="tg-cell" tabindex="-1">4 KB</div>
      </div>

      <div 
        role="row" 
        class="tg-row" 
        aria-level="2" 
        aria-posinset="2" 
        aria-setsize="2" 
        id="row-styles">
        <div role="gridcell" class="tg-cell" tabindex="-1">styles.css</div>
        <div role="gridcell" class="tg-cell" tabindex="-1">CSS File</div>
        <div role="gridcell" class="tg-cell" tabindex="-1">2 KB</div>
      </div>
    </div>

    <!-- Level 1: Item 2 -->
    <div 
      role="row" 
      class="tg-row" 
      aria-level="1" 
      aria-posinset="2" 
      aria-setsize="2" 
      aria-expanded="false" 
      id="row-public">
      <div role="gridcell" class="tg-cell" tabindex="-1">
        <span class="tg-expander" aria-hidden="true">▶</span>
        <span>public</span>
      </div>
      <div role="gridcell" class="tg-cell" tabindex="-1">Folder</div>
      <div role="gridcell" class="tg-cell" tabindex="-1">—</div>
    </div>
  </div>
</div>

<script>
  const treegrid = document.getElementById('my-treegrid');

  // Returns all visible cells as a 2D array [row][column]
  function getNavigationGrid() {
    const rows = Array.from(treegrid.querySelectorAll('[role="row"]'));
    return rows.filter(row => {
      // Exclude children of collapsed folders
      let parent = row.parentElement;
      while (parent && parent !== treegrid) {
        if (parent.classList.contains('tg-children') && 
            parent.previousElementSibling.classList.contains('collapsed')) {
          return false;
        }
        parent = parent.parentElement;
      }
      return true;
    }).map(row => Array.from(row.querySelectorAll('[role="gridcell"], [role="columnheader"]')));
  }

  function setFocus(cell) {
    if (!cell) return;
    treegrid.querySelectorAll('[role="gridcell"], [role="columnheader"]').forEach(c => {
      c.setAttribute('tabindex', '-1');
    });
    cell.setAttribute('tabindex', '0');
    cell.focus();
  }

  function toggleRowExpansion(rowNode) {
    if (!rowNode.hasAttribute('aria-expanded')) return;
    
    const isExpanded = rowNode.getAttribute('aria-expanded') === 'true';
    rowNode.setAttribute('aria-expanded', !isExpanded);
    rowNode.classList.toggle('collapsed', isExpanded);
    
    const expander = rowNode.querySelector('.tg-expander');
    if (expander) {
      expander.textContent = isExpanded ? '▶' : '▼';
    }
  }

  function getParentRow(rowNode) {
    const childrenBlock = rowNode.closest('.tg-children');
    if (!childrenBlock) return null;
    return childrenBlock.previousElementSibling;
  }

  // Keyboard Navigation Handling (WAI-ARIA Pattern)
  treegrid.addEventListener('keydown', (e) => {
    const activeCell = document.activeElement;
    if (!activeCell || !['gridcell', 'columnheader'].includes(activeCell.getAttribute('role'))) return;

    const grid = getNavigationGrid();
    let rowIndex = -1, colIndex = -1;

    for (let r = 0; r < grid.length; r++) {
      const cIndex = grid[r].indexOf(activeCell);
      if (cIndex !== -1) {
        rowIndex = r;
        colIndex = cIndex;
        break;
      }
    }

    if (rowIndex === -1) return;

    const currentRowNode = grid[rowIndex][0].parentElement;
    let handled = true;

    switch (e.key) {
      case 'ArrowDown':
        if (rowIndex < grid.length - 1) setFocus(grid[rowIndex + 1][colIndex]);
        break;
      case 'ArrowUp':
        if (rowIndex > 0) setFocus(grid[rowIndex - 1][colIndex]);
        break;
      case 'ArrowRight':
        // If on the expandable cell (first column) and collapsed -> expand it
        if (colIndex === 0 && currentRowNode.getAttribute('aria-expanded') === 'false') {
          toggleRowExpansion(currentRowNode);
        } else if (colIndex < grid[rowIndex].length - 1) {
          setFocus(grid[rowIndex][colIndex + 1]);
        }
        break;
      case 'ArrowLeft':
        // If on the expandable cell (first column) and expanded -> collapse it
        if (colIndex === 0 && currentRowNode.getAttribute('aria-expanded') === 'true') {
          toggleRowExpansion(currentRowNode);
        } else if (colIndex === 0) {
          // If first cell but leaf/collapsed, move to parent row
          const parentRow = getParentRow(currentRowNode);
          if (parentRow) {
            const parentCells = Array.from(parentRow.querySelectorAll('[role="gridcell"]'));
            setFocus(parentCells[0]);
          }
        } else if (colIndex > 0) {
          setFocus(grid[rowIndex][colIndex - 1]);
        }
        break;
      case 'Enter':
      case ' ':
        if (colIndex === 0) {
          toggleRowExpansion(currentRowNode);
        }
        break;
      case 'Home':
        setFocus(grid[rowIndex][0]);
        break;
      case 'End':
        setFocus(grid[rowIndex][grid[rowIndex].length - 1]);
        break;
      default:
        handled = false;
    }

    if (handled) e.preventDefault();
  });
</script>
</body>
</html>
