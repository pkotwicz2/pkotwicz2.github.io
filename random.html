<!DOCTYPE html>
<html lang="en">
<body>
<div role="treegrid" aria-label="Project File Directory" aria-colcount="3">
  
  <!-- Column Headers -->
  <div role="rowgroup">
    <div role="row">
      <div role="columnheader" aria-colindex="1">Name</div>
      <div role="columnheader" aria-colindex="2">Type</div>
      <div role="columnheader" aria-colindex="3">Size</div>
    </div>
  </div>

  <!-- Treegrid Body -->
  <div role="rowgroup">
    
    <!-- Level 1: Item 1 of 2 -->
    <div 
      role="row" 
      aria-level="1" 
      aria-posinset="1" 
      aria-setsize="2" 
      aria-expanded="true" 
      tabindex="0">
      <div role="gridcell">src</div>
      <div role="gridcell">Folder</div>
      <div role="gridcell">—</div>
    </div>

    <!-- Level 2 (Nested): Item 1 of 2 -->
    <div 
      role="row" 
      aria-level="2" 
      aria-posinset="1" 
      aria-setsize="2">
      <div role="gridcell">index.js</div>
      <div role="gridcell">JS File</div>
      <div role="gridcell">4 KB</div>
    </div>

    <!-- Level 2 (Nested): Item 2 of 2 -->
    <div 
      role="row" 
      aria-level="2" 
      aria-posinset="2" 
      aria-setsize="2">
      <div role="gridcell">styles.css</div>
      <div role="gridcell">CSS Stylesheet</div>
      <div role="gridcell">2 KB</div>
    </div>

    <!-- Level 1: Item 2 of 2 -->
    <div 
      role="row" 
      aria-level="1" 
      aria-posinset="2" 
      aria-setsize="2" 
      aria-expanded="false">
      <div role="gridcell">public</div>
      <div role="gridcell">Folder</div>
      <div role="gridcell">—</div>
    </div>

  </div>
</div>
</body>
</html>
