<html>
<head></head>
<body>
<div role="tree" aria-label="Project Directory">
  <!-- Level 1: Item 1 of 2 -->
  <div 
    role="treeitem" 
    aria-level="1" 
    aria-posinset="1" 
    aria-setsize="2" 
    aria-expanded="true" 
    tabindex="0"
    id="node-src">
    <span>src</span>
    
    <!-- Sub-tree Group -->
    <div role="group">
      <!-- Level 2: Item 1 of 2 -->
      <div 
        role="treeitem" 
        aria-level="2" 
        aria-posinset="1" 
        aria-setsize="2" 
        tabindex="-1"
        id="node-index-js">
        <span>index.js</span>
      </div>
      
      <!-- Level 2: Item 2 of 2 -->
      <div 
        role="treeitem" 
        aria-level="2" 
        aria-posinset="2" 
        aria-setsize="2" 
        tabindex="-1"
        id="node-app-js">
        <span>app.js</span>
      </div>
    </div>
  </div>

  <!-- Level 1: Item 2 of 2 -->
  <div 
    role="treeitem" 
    aria-level="1" 
    aria-posinset="2" 
    aria-setsize="2" 
    aria-expanded="false" 
    id="node-assets">
    <span>assets</span>
  </div>
</div>
</body></html>
