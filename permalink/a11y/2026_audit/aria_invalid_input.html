<html>
<head>
<script>
function SetInvalid() {
  SetInvalidToState(true);
}

function ClearInvalid() {
  SetInvalidToState(false);
}

function SetInvalidToState(state) {
  document.getElementById('text1').setAttribute('aria-invalid') = state; 
}
</script>
</head>
<body>
<label for="text1">Date input</label>
<input id="text1"/>
<button onclick="SetInvalid()">Set Invalid</button>
<button onclick="ClearInvalid()">Clear Invalid</button>
</body>
</html>
