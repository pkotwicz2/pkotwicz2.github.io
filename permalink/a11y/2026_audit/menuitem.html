<html>
<body>
<div role="menu" aria-label="Virtualized Actions Menu">
  <!-- 
    Using aria-posinset and aria-setsize informs screen readers of the item's 
    actual position in a set when not all items are currently rendered in the DOM.
  -->
  <div 
    role="menuitem" 
    aria-posinset="1" 
    aria-setsize="3" 
    tabindex="0">
    Menu Item A
  </div>
  <div 
    role="menuitem" 
    aria-posinset="2" 
    aria-setsize="3" 
    tabindex="0">
    Menu Item B
  </div>
  <div 
    role="menuitem" 
    aria-posinset="3" 
    aria-setsize="3" 
    tabindex="0">
    Menu Item C
  </div>
</div>
</body>
</html>
