  <div role="rowgroup" class="MyGridBodyGroup">

    <div role="row" class="MyGridRow">
      <!-- Roving tabindex used for keyboard navigation between cells -->
      <div role="gridcell" tabindex="0" aria-selected="true" class="MyGridCell" aria-label="Bob">Alice</div>

      <div role="gridcell" tabindex="-1" class="MyGridCell">
        <button class="MyCellButton" tabindex="-1">Edit</button>
      </div>
    </div>
  </div>

</html>
