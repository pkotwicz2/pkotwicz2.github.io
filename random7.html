<!DOCTYPE html>
   <html>
      <head>
         <style>img{vertical-align:bottom;}</style>
         <title>-</title>
      </head>
      <body style="padding-left:16px; padding-right:16px; padding-top:8px; padding-bottom:8px">
         <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=3, user-scalable=1"/>
        <fieldset>
  <legend>Choose your favorite fruit:</legend>

  <div>
    <input type="radio" id="fruitApple" name="favoriteFruit" value="apple" checked>
    <label for="fruitApple">Apple</label>
  </div>

  <div>
    <input type="radio" id="fruitBanana" name="favoriteFruit" value="banana">
    <label for="fruitBanana">Banana</label>
  </div>

  <div>
    <input type="radio" id="fruitOrange" name="favoriteFruit" value="orange">
    <label for="fruitOrange">Orange</label>
  </div>
</fieldset>
<div class="tab-widget-container">
  <!-- Tablist Wrapper -->
  <div role="tablist" aria-label="Feature Settings" class="tab-list">
    <!-- 10 Tabs -->
    <button role="tab" aria-selected="true" aria-controls="panel-1" id="tab-1" tabindex="0">Overview</button>
    <button role="tab" aria-selected="false" aria-controls="panel-2" id="tab-2" tabindex="-1">Users</button>
    <button role="tab" aria-selected="false" aria-controls="panel-3" id="tab-3" tabindex="-1">Billing</button>
    <button role="tab" aria-selected="false" aria-controls="panel-4" id="tab-4" tabindex="-1">Security</button>
    <button role="tab" aria-selected="false" aria-controls="panel-5" id="tab-5" tabindex="-1">Integrations</button>
    <button role="tab" aria-selected="false" aria-controls="panel-6" id="tab-6" tabindex="-1">Permissions</button>
    <button role="tab" aria-selected="false" aria-controls="panel-7" id="tab-7" tabindex="-1">Notifications</button>
    <button role="tab" aria-selected="false" aria-controls="panel-8" id="tab-8" tabindex="-1">Storage</button>
    <button role="tab" aria-selected="false" aria-controls="panel-9" id="tab-9" tabindex="-1">Backups</button>
    <button role="tab" aria-selected="false" aria-controls="panel-10" id="tab-10" tabindex="-1">Advanced</button>
  </div>

  <!-- Tab Panels -->
  <div role="tabpanel" id="panel-1" aria-labelledby="tab-1" tabindex="0" class="tab-panel">
    <h3>Overview Content</h3>
  </div>
  <div role="tabpanel" id="panel-2" aria-labelledby="tab-2" tabindex="0" class="tab-panel" hidden>
    <h3>Users Content</h3>
  </div>
  <div role="tabpanel" id="panel-3" aria-labelledby="tab-3" tabindex="0" class="tab-panel" hidden>
    <h3>Billing Content</h3>
  </div>
  <div role="tabpanel" id="panel-4" aria-labelledby="tab-4" tabindex="0" class="tab-panel" hidden>
    <h3>Security Content</h3>
  </div>
  <div role="tabpanel" id="panel-5" aria-labelledby="tab-5" tabindex="0" class="tab-panel" hidden>
    <h3>Integrations Content</h3>
  </div>
  <div role="tabpanel" id="panel-6" aria-labelledby="tab-6" tabindex="0" class="tab-panel" hidden>
    <h3>Permissions Content</h3>
  </div>
  <div role="tabpanel" id="panel-7" aria-labelledby="tab-7" tabindex="0" class="tab-panel" hidden>
    <h3>Notifications Content</h3>
  </div>
  <div role="tabpanel" id="panel-8" aria-labelledby="tab-8" tabindex="0" class="tab-panel" hidden>
    <h3>Storage Content</h3>
  </div>
  <div role="tabpanel" id="panel-9" aria-labelledby="tab-9" tabindex="0" class="tab-panel" hidden>
    <h3>Backups Content</h3>
  </div>
  <div role="tabpanel" id="panel-10" aria-labelledby="tab-10" tabindex="0" class="tab-panel" hidden>
    <h3>Advanced Content</h3>
  </div>
</div>
      </body>
   </html>
