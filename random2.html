<html><body>
<div role="menu" aria-label="Virtualized Actions Menu">
  <!-- 
    Using aria-posinset and aria-setsize informs screen readers of the item's 
    actual position in a set when not all items are currently rendered in the DOM.
  -->
  <div 
    role="menuitem" 
    aria-posinset="14" 
    aria-setsize="50" 
    tabindex="0">
    Action Item 14
  </div>
  <div 
    role="menuitem" 
    aria-posinset="15" 
    aria-setsize="50" 
    tabindex="-1">
    Action Item 15
  </div>
  <div 
    role="menuitem" 
    aria-posinset="16" 
    aria-setsize="50" 
    tabindex="-1">
    Action Item 16
  </div>
</div>
</body>
</html>
