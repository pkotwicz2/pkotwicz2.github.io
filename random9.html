<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Trail Canvas</title>
  <meta name="description" content="Move your mouse over the canvas to turn pixels black.">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
    canvas { display: block; cursor: crosshair; }
  </style>
</head>
<body>
  <canvas id="pixel-canvas" width="487" height="1073"></canvas>
  <script>
    const canvas = document.getElementById('pixel-canvas');
    const ctx = canvas.getContext('2d');
    let last = null;

    // One canvas pixel == one CSS pixel. Resizing clears the canvas.
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      ctx.fillStyle = '#000';
      last = null;
    }

    function setPixel(x, y) {
      ctx.fillRect(x, y, 1, 1);
    }

    // Bresenham line so fast mouse movements don't skip pixels.
    function drawLine(x0, y0, x1, y1) {
      const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
      const dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
      let err = dx + dy;
      while (true) {
        setPixel(x0, y0);
        if (x0 === x1 && y0 === y1) break;
        const e2 = 2 * err;
        if (e2 >= dy) { err += dy; x0 += sx; }
        if (e2 <= dx) { err += dx; y0 += sy; }
      }
    }

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor(e.clientX - rect.left);
      const y = Math.floor(e.clientY - rect.top);
      if (last) drawLine(last.x, last.y, x, y);
      else setPixel(x, y);
      last = { x, y };
    });

    canvas.addEventListener('mouseleave', () => { last = null; });
    window.addEventListener('resize', resize);
    resize();
  </script>


</body></html>
