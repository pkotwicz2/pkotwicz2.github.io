    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <title>Show/Hide Canvas</title>
    <style>
      canvas { border: 1px solid #888; display: block; margin-top: 8px; }
      .hidden { display: none; }
    </style>
    </head>
    <body>
      <button id="toggle" aria-controls="canvas" aria-expanded="true">Hide canvas</button>
      <canvas id="canvas" width="300" height="150"></canvas>

    <script>
      const canvas = document.getElementById('canvas');
      const button = document.getElementById('toggle');
      const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let letterIndex = 0;

      function draw() {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffd6d6';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#000';
        ctx.font = 'bold 64px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(ALPHABET[letterIndex], canvas.width / 2, canvas.height / 2);
      }

      draw();

      button.addEventListener('click', () => {
        // Advance to the next letter, wrapping from Z back to A.
        letterIndex = (letterIndex + 1) % ALPHABET.length;
        draw();

        const hidden = canvas.classList.toggle('hidden');
        button.textContent = hidden ? 'Show canvas' : 'Hide canvas';
        button.setAttribute('aria-expanded', String(!hidden));
      });
    </script>
    </body>
    </html>
