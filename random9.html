<html>
<body>
<button id="test" onclick="ABCD()" role="switch">Test</button>
<div id="done"></div>
<script>
function ABCD() {
    var el = document.getElementById("test");
    if (el.hasAttribute("aria-checked")) {
        el.removeAttribute("aria-checked");
        el.innerText = "Test 1";
    } else {
        el.setAttribute("aria-checked", "true");
        el.innerText = "Test 2";
    }
}
</script>
</body>
</html>
