    <!DOCTYPE html>
    <html lang="en">
    <body style="font-size:20px">
    <h3>Before</h3>
    <div role="table" style="display:grid; grid-template-columns:repeat(3, auto); justify-content:start; gap:2px;">
        <div role="row" style="display:contents">
            <div role="cell" style="padding:1px">1</div>
            <div role="cell" style="padding:1px">2</div>
            <div role="cell" style="padding:1px">3</div>
        </div>
        <div role="row" style="display:contents">
            <div role="cell" aria-colspan="2" style="grid-column:span 2; padding:1px">4</div>
            <div role="cell" style="padding:1px">5</div>
        </div>
        <div role="row" style="display:contents">
            <div role="cell" style="padding:1px">6</div>
            <div role="cell" style="padding:1px">7</div>
            <div role="cell" style="padding:1px">8</div>
        </div>
    </div>
    <h3>After</h3>
    </body>
    </html>
