<!DOCTYPE html>
<html lang="en">
<head>
<style>
    #error {
      color:red;
      font-weight:bold;
    }
</style>
<script>
function $(id) {
    return document.getElementById(id);
}
    
function ValidateEmail() {
    var field = $("email");
    if (field.indexOf("@") >= 0) {
        field.setAttribute("aria-errormessage", "");
        $("error").style.display = "none";
    }
}
</script>
</head>
<body>
E-mail <input aria-required="true" aria-errormessage="needs valid e-mail address" id="email" onkeydown="ValidateEmail()" required/><br/>
<span id="error">Invalid e-mail</span><br/>
</body>
</html>
