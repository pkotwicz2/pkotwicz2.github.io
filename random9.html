<!DOCTYPE html>
<html lang="en">
<head>
<style>
    #error {
      color:red;
      font-weight:bold;
    }
</style>
<script>
function $(id) {
    return document.getElementById(id);
}
    
function ValidateEmail() {
    var field = $("email");
    if (field.value.indexOf("@") >= 0) {
        field.setAttribute("aria-invalid", "false");
        $("error").style.display = "none";
    } else {
        field.setAttribute("aria-invalid", "true");
        $("error").style.display = "block";
    }
}
</script>
</head>
<body>
<label for="email">E-mail</label><input aria-required="true" aria-invalid="true" aria-errormessage="error" id="email" onkeyup="ValidateEmail()" required></input><br/>
<span id="error">Invalid e-mail</span><br/>
</body>
</html>
